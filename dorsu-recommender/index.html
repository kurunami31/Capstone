<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DCPR — A rule-based college program recommender system for Davao Oriental State University. Find your best-fit program based on SHS strand, grades, aptitude, and personality." />
  <meta property="og:title" content="DOrSU College Program Recommender" />
  <meta property="og:description" content="Find your best-fit college program at Davao Oriental State University based on SHS strand, grades, aptitude, and personality." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://dorsu-recommender.onrender.com" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="DOrSU College Program Recommender" />
  <meta name="twitter:description" content="Find your best-fit college program at Davao Oriental State University." />
  <title>DOrSU College Program Recommender</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 4L2 12l14 8 14-8-14-8z' fill='%231a56db'/><path d='M6 14v5c0 2 4.5 4 10 4s10-2 10-4v-5' fill='none' stroke='%231a56db' stroke-width='2'/></svg>" />
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark')</script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: var(--bg-primary, #0f172a); min-height: 100%; }

    [data-theme="light"] {
      --bg-primary: #f1f5f9;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --text-input: #1e293b;
      --label-color: #334155;
      --card-bg: rgba(255,255,255,0.85);
      --card-border: rgba(0,0,0,0.08);
      --modal-bg: #ffffff;
      --row-bg: rgba(0,0,0,0.02);
      --track-bg: rgba(0,0,0,0.08);
      --border-strong: rgba(0,0,0,0.15);
      --table-header: #e2e8f0;
      --danger: #dc2626;
      --danger-bg: rgba(220,38,38,0.1);
      --accent-bg: rgba(37,99,235,0.1);
      --accent-text: #2563eb;
      --sidebar-bg: #ffffff;
      --sidebar-border: rgba(0,0,0,0.06);
      --input-bg: #ffffff;
      --input-border: rgba(0,0,0,0.12);
      --overlay-bg: rgba(0,0,0,0.4);
      --gradient-start: #e2e8f0;
      --gradient-mid: #f1f5f9;
      --gradient-end: #e2e8f0;
      --hover-bg: rgba(0,0,0,0.04);
      --accent-blue: #2563eb;
      --notification-unread: rgba(37,99,235,0.06);
      --notification-unread-border: rgba(37,99,235,0.15);
    }
    [data-theme="dark"] {
      --bg-primary: #0f172a;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --text-input: #e2e8f0;
      --label-color: #cbd5e1;
      --card-bg: rgba(255,255,255,0.04);
      --card-border: rgba(255,255,255,0.08);
      --modal-bg: #1e293b;
      --row-bg: rgba(255,255,255,0.03);
      --track-bg: rgba(255,255,255,0.06);
      --border-strong: rgba(255,255,255,0.1);
      --table-header: #1e3a5f;
      --danger: #f87171;
      --danger-bg: rgba(248,113,113,0.1);
      --accent-bg: rgba(59,130,246,0.15);
      --accent-text: #60a5fa;
      --sidebar-bg: #0b1222;
      --sidebar-border: rgba(255,255,255,0.05);
      --input-bg: rgba(255,255,255,0.05);
      --input-border: rgba(255,255,255,0.1);
      --overlay-bg: rgba(0,0,0,0.6);
      --gradient-start: #0f172a;
      --gradient-mid: #1e3a5f;
      --gradient-end: #0f172a;
      --hover-bg: rgba(255,255,255,0.06);
      --accent-blue: #3b82f6;
      --notification-unread: rgba(59,130,246,0.06);
      --notification-unread-border: rgba(59,130,246,0.15);
    }

    @media (max-width: 768px) {
      .hide-mobile { display: none !important; }
      .full-mobile { width: 100% !important; }
      .stack-mobile { flex-direction: column !important; }
      .card-padding-mobile { padding: 24px !important; }
      .gap-mobile { gap: 8px !important; }
      .r-grid-2 { grid-template-columns: 1fr !important; }
      .r-flex-row { flex-direction: row !important; }
      .r-text-center { text-align: center !important; }
      .r-mb-8 { margin-bottom: 8px !important; }
    }

    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    :focus-visible {
      outline: 2px solid var(--accent-text, #60a5fa);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <noscript>
    <div style="padding:40px;text-align:center;font-family:sans-serif;color:#94a3b8;background:#0f172a;min-height:100vh">
      <h1 style="font-size:22px;color:#f1f5f9;margin-bottom:12px">DOrSU College Program Recommender</h1>
      <p>JavaScript is required to use this application. Please enable JavaScript in your browser settings.</p>
    </div>
  </noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
