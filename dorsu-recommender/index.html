<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOrSU College Program Recommender</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 4L2 12l14 8 14-8-14-8z' fill='%231a56db'/><path d='M6 14v5c0 2 4.5 4 10 4s10-2 10-4v-5' fill='none' stroke='%231a56db' stroke-width='2'/></svg>" />
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark')</script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: var(--bg-primary, #0f172a); min-height: 100%; }

    [data-theme="light"] {
      --bg-primary: #f1f5f9;
      --bg-card: rgba(255,255,255,0.8);
      --bg-card-hover: rgba(255,255,255,0.9);
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border-color: rgba(0,0,0,0.08);
      --sidebar-bg: #ffffff;
      --sidebar-border: rgba(0,0,0,0.06);
      --input-bg: #ffffff;
      --input-border: rgba(0,0,0,0.12);
      --overlay-bg: rgba(0,0,0,0.4);
      --gradient-start: #e2e8f0;
      --gradient-mid: #f1f5f9;
      --gradient-end: #e2e8f0;
      --card-bg: rgba(255,255,255,0.85);
      --card-border: rgba(0,0,0,0.08);
      --modal-bg: #ffffff;
      --hover-bg: rgba(0,0,0,0.04);
      --accent-blue: #2563eb;
    }
    [data-theme="dark"] {
      --bg-primary: #0f172a;
      --bg-card: rgba(255,255,255,0.04);
      --bg-card-hover: rgba(255,255,255,0.07);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-color: rgba(255,255,255,0.08);
      --sidebar-bg: #0b1222;
      --sidebar-border: rgba(255,255,255,0.05);
      --input-bg: rgba(255,255,255,0.05);
      --input-border: rgba(255,255,255,0.1);
      --overlay-bg: rgba(0,0,0,0.6);
      --gradient-start: #0f172a;
      --gradient-mid: #1e3a5f;
      --gradient-end: #0f172a;
      --card-bg: rgba(255,255,255,0.04);
      --card-border: rgba(255,255,255,0.08);
      --modal-bg: #1e293b;
      --hover-bg: rgba(255,255,255,0.06);
      --accent-blue: #3b82f6;
    }

    @media (max-width: 768px) {
      .hide-mobile { display: none !important; }
      .full-mobile { width: 100% !important; }
      .stack-mobile { flex-direction: column !important; }
      .card-padding-mobile { padding: 24px !important; }
      .gap-mobile { gap: 8px !important; }
      .r-grid-2 { grid-template-columns: 1fr !important; }
      .r-flex-row { flex-direction: row !important; }
      .r-text-center { text-align: center !important; }
      .r-mb-8 { margin-bottom: 8px !important; }
    }

    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
